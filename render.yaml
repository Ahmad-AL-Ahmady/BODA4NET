services:
  - type: web
    name: boda4net
    env: node
    plan: starter
    buildCommand: npm install && npm run build && cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: UQ_PUBLIC_KEY
        sync: false
      - key: UQ_SECRET_KEY
        sync: false
      - key: SHA7NAWY_PUBLIC_KEY
        sync: false
      - key: SHA7NAWY_SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: LOG_LEVEL
        value: info
